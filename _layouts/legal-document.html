---
layout: base
---
<section class="mx-auto w-full max-w-5xl px-4 py-16 sm:px-6 lg:px-8 lg:py-24">
  <div class="rounded-[2rem] border border-slate-900/10 bg-white/80 p-8 shadow-2xl shadow-slate-900/10 backdrop-blur dark:border-white/10 dark:bg-slate-900/70 dark:shadow-black/20 sm:p-10">
    <div class="flex flex-col gap-4 border-b border-slate-900/10 pb-8 dark:border-white/10 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-brand-600 dark:text-brand-300">Legal</p>
        <h1 class="mt-2 text-3xl font-semibold tracking-tight text-slate-950 dark:text-white">{{ page.title }}</h1>
      </div>
      <a href="{{ '/products/' | relative_url }}" class="inline-flex items-center text-sm font-semibold text-brand-700 transition hover:text-brand-600 dark:text-brand-300 dark:hover:text-brand-200">← Back to products</a>
    </div>

    <article class="prose prose-slate mt-10 max-w-none prose-headings:tracking-tight prose-a:text-brand-700 prose-a:no-underline hover:prose-a:text-brand-600 prose-strong:text-slate-950 dark:prose-invert dark:prose-strong:text-white dark:prose-a:text-brand-300 dark:hover:prose-a:text-brand-200">
      {{ content }}
    </article>
  </div>
</section>
